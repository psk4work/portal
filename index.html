<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .portal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .app-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 200px;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .app-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .app-name {
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Web Portal ของฉัน</h1>
    <p>รวบรวมเว็บแอปพลิเคชันทั้งหมดไว้ที่นี่ คลิกเพื่อใช้งานได้เลย</p>

    <div class="portal-container">
        <!-- เว็บแอปที่ 1 -->
        <a href="https://URL-เว็บแอปของคุณ-1.com" class="app-card" target="_blank">
            <div class="app-icon">📊</div>
            <div class="app-name">แอปแดชบอร์ด</div>
        </a>

        <!-- เว็บแอปที่ 2 -->
        <a href="https://URL-เว็บแอปของคุณ-2.com" class="app-card" target="_blank">
            <div class="app-icon">📝</div>
            <div class="app-name">แอปบันทึกข้อมูล</div>
        </a>
    </div>

</body>
</html>
