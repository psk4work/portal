<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1, h2 {
            color: #333;
        }
        .portal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        .app-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 200px;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .app-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .app-name {
            font-weight: bold;
            font-size: 16px;
        }
        .calendar-container {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <h1>Web Portal ของฉัน</h1>
    <p>รวบรวมเว็บแอปพลิเคชันและปฏิทินกิจกรรมไว้ที่นี่</p>

    <!-- ส่วนไอคอนเว็บแอป -->
    <div class="portal-container">
        <a href="https://URL-เว็บแอปของคุณ-1.com" class="app-card" target="_blank">
            <div class="app-icon">📊</div>
            <div class="app-name">แอปแดชบอร์ด</div>
        </a>
        <a href="https://URL-เว็บแอปของคุณ-2.com" class="app-card" target="_blank">
            <div class="app-icon">📝</div>
            <div class="app-name">แอปบันทึกข้อมูล</div>
        </a>
    </div>

    <!-- ส่วนปฏิทิน Google Calendar -->
    <h2>ปฏิทินการประชุม / กิจกรรม</h2>
    <div class="calendar-container">
        <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Asia%2FBangkok&title=%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%8A%E0%B8%B8%E0%B8%A1%2F%E0%B8%AA%E0%B8%B1%E0%B8%A1%E0%B8%A1%E0%B8%99%E0%B8%B2%2F%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%20%E0%B8%A8%E0%B8%9B%E0%B8%97.&mode=AGENDA&src=dGFudGthN2o5Y28wYTg4azhtcGtxaXF2dGtAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&color=%234285f4" style="border:solid 1px #777" width="1000" height="500" frameborder="0" scrolling="no"></iframe>
    </div>

</body>
</html>
